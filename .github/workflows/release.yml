name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BIN: vllm-top

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up cross toolchain
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Install musl-gcc (native target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # ring's build script needs a C compiler for the musl target
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="${BIN}-${version}-${{ matrix.name }}"
          exe="vllm-top"
          if [[ "${{ matrix.os }}" == windows* ]]; then exe="vllm-top.exe"; fi
          mkdir -p "$base"
          cp "target/${{ matrix.target }}/release/$exe" "$base/"
          cp README.md LICENSE "$base/"
          file="${base}.${{ matrix.archive }}"
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a "$file" "$base"
          else
            tar -czf "$file" "$base"
          fi
          sha256sum "$file" > "$file.sha256"
          mkdir -p dist
          mv "$file" "$file.sha256" "$base" dist/
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  macos:
    name: macos-universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build both slices
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="dist/${BIN}-${version}-macos-universal"
          mkdir -p "$out"
          lipo -create \
            "target/x86_64-apple-darwin/release/${BIN}" \
            "target/aarch64-apple-darwin/release/${BIN}" \
            -output "$out/${BIN}"
          cp README.md LICENSE "$out/"
          tar -czf "${out}.tar.gz" -C dist "$(basename "$out")"
          shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
